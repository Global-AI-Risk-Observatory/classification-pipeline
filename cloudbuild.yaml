# Cloud Build: on every push to main, run the tests, build the image, push it to Artifact Registry.
steps:
  - name: python:3.12-slim
    id: test
    entrypoint: bash
    args:
      - -c
      - pip install --no-cache-dir -q ".[dev,gemini]" && python -m pytest -q
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_IMAGE}:${COMMIT_SHA}
      - -t
      - ${_IMAGE}:latest
      - .
images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_IMAGE}:latest
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/airo/pipeline
options:
  logging: CLOUD_LOGGING_ONLY
