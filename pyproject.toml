[project]
name = "airo"
version = "0.1.0"
description = "Classification pipeline for AI-related content in corporate reports"
requires-python = ">=3.10"
dependencies = ["lxml>=5", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gemini = ["google-genai>=1"]
gcs = ["google-cloud-storage>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
